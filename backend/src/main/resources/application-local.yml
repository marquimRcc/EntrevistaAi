spring:
  datasource:
    url: jdbc:h2:file:./data/entrevista_ia;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  secret: ${JWT_SECRET:dev-secret-key-com-pelo-menos-32-caracteres-para-teste-local!}

app:
  auth:
    bypass: true

openai:
  base-url: ${OPENAI_BASE_URL:http://localhost:1234/v1}
  api-key: ${OPENAI_API_KEY:lm-studio}
  model: ${OPENAI_MODEL:qwen2.5-coder-14b-instruct}
  json-mode-enabled: false
